name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHOMEN_SPEC_POSTGRES: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      # install-crystal runs apt-get install without an update, so a stale
      # package list on the runner fails with 404s.
      - run: sudo apt-get update
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      # Ubuntu 24.04 keeps Chrome's sandbox from unprivileged user namespaces.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: "TEMP diagnose Chrome start"
        run: |
          chrome=$(command -v google-chrome)
          "$chrome" --version
          for i in 1 2 3 4 5; do
            dir=$(mktemp -d)
            start=$(date +%s%N)
            "$chrome" --headless --disable-gpu --no-first-run --no-default-browser-check --user-data-dir="$dir" --remote-debugging-port=0 about:blank 2> "$dir.err" &
            pid=$!
            for t in $(seq 1 900); do
              grep -q "DevTools listening" "$dir.err" && break
              sleep 0.1
            done
            end=$(date +%s%N)
            echo "launch $i: $(( (end - start) / 1000000 )) ms"
            head -5 "$dir.err"
            kill "$pid"; wait "$pid" || true
          done
      - run: shards install
      - run: crystal tool format --check src spec examples
      - run: crystal build src/shomen.cr --error-trace -o /tmp/shomen
      - run: crystal spec
      - name: examples/hello
        working-directory: examples/hello
        run: |
          shards install
          crystal spec
      - name: examples/records
        working-directory: examples/records
        run: |
          shards install
          crystal spec
          RECORDS_SPEC_POSTGRES="$SHOMEN_SPEC_POSTGRES" crystal spec
      # The commands of docs/en/05-SCALE-OUT.md: two processes on one
      # Postgres database, without and then with a replica URL
      # (docs/decisions/20261003-phase8-scale-out.md).
      - name: examples/records on two processes
        working-directory: examples/records
        env:
          SHOMEN_ENV: production
          SHOMEN_SECRET: ci-two-processes-secret-0123456789abcdef
          RECORDS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: sh scripts/two_processes.sh
      - name: examples/records on two processes with a replica URL
        working-directory: examples/records
        env:
          SHOMEN_ENV: production
          SHOMEN_SECRET: ci-two-processes-secret-0123456789abcdef
          RECORDS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          RECORDS_REPLICA_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: sh scripts/two_processes.sh
